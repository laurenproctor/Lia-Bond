# Merge gate: `verify` runs lint/typecheck/test/build; `database` runs every SQL
# harness — migration, execution, generation, yelp, reddit, tenancy, the
# expansion-only rehearsal, and both website widgets — against a freshly started
# local Supabase instance.
# Runbook (owner action, tracked separately): once this workflow is green on `master`,
# mark the `database` job a required status check in branch protection so a TypeScript
# matrix change can never merge with stale SQL behavior.
name: verify
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run verify
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      # This exact combination (Postgres 17.6, Supabase CLI 2.101.0) DOES segfault the whole
      # local cluster on an EXECUTE-denied call of a non-immutable function after `set role` —
      # the same shape as an unauthorized PostgREST RPC call (Task 11). The pin is not "verified
      # safe"; it is a known-quantity image whose crash the harness is written to route around,
      # not one it fixes. db:verify-execution proves "service_role cannot execute
      # raise_escalation directly" via a static pg_catalog.has_function_privilege check rather
      # than by attempting the denied call, because attempting it would take the harness's own
      # database down mid-run. Bumping this pin requires a local `npm run db:verify-execution`
      # run first — a different image could change the segfault behavior in either direction,
      # and nothing here would notice without that run.
      - uses: supabase/setup-cli@v1
        with: { version: "2.101.0" }
      - run: npm ci
      - run: supabase start
      - name: Run the database harness against freshly migrated Postgres
        run: |
          export SUPABASE_DB_URL="$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '\"')"
          npm run db:verify-execution
      # The generation harness runs against the same started stack. Each script
      # begins with its own `supabase db reset`, so ordering them costs a reset
      # and nothing else: neither can inherit the other's fixtures.
      - name: Run the generation harness against freshly migrated Postgres
        run: |
          export SUPABASE_DB_URL="$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '\"')"
          npm run db:verify-generation
      # Same arrangement again: the Yelp harness resets first, so it cannot
      # inherit the generation fixtures. It proves the constraints that keep a
      # typed review distinguishable from a fetched one, and a user-confirmed
      # publication distinguishable from a provider-verified one — neither of
      # which a TypeScript-only review could catch drifting.
      - name: Run the yelp harness against freshly migrated Postgres
        run: |
          export SUPABASE_DB_URL="$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '\"')"
          npm run db:verify-yelp
      # Same arrangement again: the Reddit harness resets first, so it cannot
      # inherit the generation fixtures, and the race script cleans up its own
      # throwaway organization whatever happens.
      - name: Run the reddit harness against freshly migrated Postgres
        run: |
          export SUPABASE_DB_URL="$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '\"')"
          npm run db:verify-reddit
      # Tenancy: the composite same-organization foreign keys, the active-manager
      # trigger, provisioning idempotency, and create-and-map. Includes the
      # two-session race harness, which is the only thing that can falsify the
      # claim that each function's insert *is* its idempotency decision — the
      # sequential checks in tenancy-verification.sql pass against a
      # read-then-insert implementation too.
      - name: Run the tenancy harness against freshly migrated Postgres
        run: |
          export SUPABASE_DB_URL="$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '\"')"
          npm run db:verify-tenancy
      # The two website widgets, together. Both harnesses reset first, so
      # neither inherits the other's fixtures, and `db:verify-website-widgets`
      # runs them in one psql session after rls-verification.sql — which is
      # where the policy, grant, and anon-surface checks for both tables live.
      #
      # This step closes a gap rather than only adding one: the review widget
      # shipped with `db:verify-review-widget` as a local-only command, so the
      # SQL mirror of its eligibility predicate has never been exercised in CI.
      # Both functions are hand-written mirrors of TypeScript predicates and
      # **nothing in the vitest suite can execute either** — the unit tests can
      # only prove the migrations *name* each rule in a comment. Without this
      # step, a rule that drifts between the two implementations merges green,
      # and the first anybody hears of it is a guest reading a dismissed review
      # or a retracted headline on a restaurant's homepage.
      - name: Run the website widget harnesses against freshly migrated Postgres
        run: |
          export SUPABASE_DB_URL="$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '"')"
          npm run db:verify-website-widgets
      # And again with the R3 contraction reversed. The rollout is
      # expand-contract, so production spends real time in a state `supabase db
      # reset` cannot reproduce — it applies every migration in the directory,
      # contraction included. Without this step the single most important
      # rollout assertion (T-26: the currently deployed application still works
      # after the expansion migrations land) is skipped on every run, and a
      # guarded section that never executes looks exactly like one that passed.
      - name: Rehearse the expansion-only rollout state
        run: |
          export SUPABASE_DB_URL="$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '\"')"
          npm run db:verify-tenancy-expanded
